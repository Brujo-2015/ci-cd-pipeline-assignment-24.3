name: Deploy Cloud Run on Merge

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  deploy-production:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CI_CD_PIPELINE_ASSIGNMENT_24_3 }}

      - name: Deploy production to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: express-production
          region: us-central1
          source: .
          flags: --allow-unauthenticated